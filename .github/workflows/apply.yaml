name: Tofu apply
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Mint Keycloak client assertion from GitHub OIDC
        run: |
          audience="https://sso.massopen.cloud/realms/master"
          value=$(curl -sf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${audience}" | jq -r '.value')
          if [ -z "$value" ] || [ "$value" = "null" ]; then
            echo "failed to obtain GitHub OIDC token" >&2
            exit 1
          fi
          printf '%s' "$value" > "$RUNNER_TEMP/kc_assertion.jwt"
          echo "TF_VAR_KEYCLOAK_JWT_TOKEN_FILE=$RUNNER_TEMP/kc_assertion.jwt" >> "$GITHUB_ENV"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: TF init
        run: tofu init

      - name: TF validate
        run: tofu validate

      - name: TF plan
        run: tofu plan -out tfplan

      - name: TF apply
        run: tofu apply -concise -auto-approve tfplan
