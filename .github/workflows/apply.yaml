name: Tofu apply
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: TF init
        run: tofu init

      - name: TF validate
        run: tofu validate

      # Keycloak enforces single-use on client assertions, so plan and apply
      # each need a freshly minted token (a reused jti is rejected).
      - name: Mint Keycloak client assertion for plan
        uses: ./.github/actions/mint-kc-assertion

      - name: TF plan
        run: tofu plan -out tfplan

      - name: Mint Keycloak client assertion for apply
        uses: ./.github/actions/mint-kc-assertion

      - name: TF apply
        run: tofu apply -concise -auto-approve tfplan
